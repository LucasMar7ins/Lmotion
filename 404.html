<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/png" href="assets/favicon.png">
<title>Página não encontrada — Lmotion</title>
<link rel="stylesheet" href="portal/style.css">
</head>
<body>

<div class="login-wrap">
  <svg class="login-grain" aria-hidden="true"><filter id="grainFilter"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#grainFilter)"/></svg>
  <div class="login-glow login-glow-top"></div>
  <div class="login-glow login-glow-br"></div>
  <div class="login-glow login-glow-bl"></div>

  <div class="login-card" style="text-align:center;">
    <div class="login-logo-wrap">
      <img src="assets/logo.png" alt="Lmotion logo">
    </div>
    <h1 style="font-size:2rem;margin-bottom:6px;">404</h1>
    <p class="sub">Essa página não existe ou foi movida.</p>
    <a href="/" id="btn404Voltar" class="btn btn-block" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;margin-top:20px;">Voltar para o início</a>
    <p class="login-footer" id="footer404">Lmotion &middot; agência de marketing digital</p>
  </div>
</div>

<script>
  if (window.location.pathname.indexOf('/portal') === 0) {
    var btn = document.getElementById('btn404Voltar');
    btn.textContent = 'Voltar para o portal';
    btn.setAttribute('href', '/portal/');
    document.getElementById('footer404').textContent = 'Lmotion · portal do cliente';
  }
</script>

</body>
</html>
